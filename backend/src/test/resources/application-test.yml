spring:
  application:
    name: o2o-food-pickup-backend-test
  datasource:
    url: jdbc:h2:mem:o2ofood_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: false

app:
  jobs:
    reservation-cleanup-ms: 36000000
    auto-confirm-catchup-ms: 36000000
