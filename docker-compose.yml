name: o2o-food-pickup-system

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: o2ofood-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-O2oFood@StrongPass2026!}
      MSSQL_PID: "Developer"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - o2ofood-net

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: o2ofood-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-O2oFood@StrongPass2026!}
      MSSQL_DB_NAME: ${MSSQL_DB_NAME:-o2ofood_db}
    entrypoint:
      - /bin/bash
      - -c
      - |
        SQLCMD_BIN="/opt/mssql-tools18/bin/sqlcmd"
        if [ ! -f "$$SQLCMD_BIN" ]; then
          SQLCMD_BIN="/opt/mssql-tools/bin/sqlcmd"
        fi
        $$SQLCMD_BIN -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID('$$MSSQL_DB_NAME') IS NULL CREATE DATABASE [$$MSSQL_DB_NAME] COLLATE Vietnamese_100_CI_AS_SC_UTF8;"
    networks:
      - o2ofood-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: o2ofood-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Ho_Chi_Minh"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL:-jdbc:sqlserver://sqlserver:1433;databaseName=o2ofood_db;encrypt=true;trustServerCertificate=true;sendTimeAsDateTime=false}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-O2oFood@StrongPass2026!}
      JWT_SECRET: ${JWT_SECRET:-O2oFoodPickupSystem2026SuperSecretKeyForHmacSha512MustBeAtLeast64BytesLong!}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-DEMO_O2OFOOD}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-VNPAYSANDBOXSECRETKEY2026O2OFOODPICKUP}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost/payment/vnpay-return}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - o2ofood-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: o2ofood-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - o2ofood-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: o2ofood-cloudflared
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --url http://api:8080
    networks:
      - o2ofood-net

volumes:
  sqlserver_data:

networks:
  o2ofood-net:
    driver: bridge
